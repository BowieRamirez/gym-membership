<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phone light mode: more yellow (mockup)</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@600&display=swap" rel="stylesheet">
<style>
  /* Tokens from src/GymMembership.App/Resources/Styles/Colors.xaml */
  :root { --y: #FFEC00; --ink: #111111; --muted: #5B5B5B; --page: #EEEEEE; --card: #FFFFFF; --line: #E4E4E4; --edge: #808080; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #2a2a2a; color: #ddd; font: 14px/1.4 Barlow, system-ui, sans-serif; }
  ::selection { background: var(--y); color: #111; }
  header.top { padding: 18px 24px 4px; }
  header.top h1 { margin: 0 0 4px; font: 600 20px Barlow; color: #fff; }
  header.top p { margin: 0; color: #aaa; max-width: 90ch; }
  .row { display: flex; gap: 26px; padding: 20px 24px 40px; overflow-x: auto; align-items: flex-start; }
  .col { flex: none; width: 300px; }
  .col h2 { margin: 0 0 4px; font: 600 16px Barlow; color: #fff; min-height: 42px; }
  .col .what { margin: 0 0 12px; color: #aaa; min-height: 58px; font-size: 13px; }

  /* the phone */
  .phone { width: 300px; height: 620px; border-radius: 30px; overflow: hidden; display: flex; flex-direction: column; background: var(--page); color: var(--ink); border: 6px solid #000; }
  .status { height: 26px; font-size: 11px; display: flex; align-items: center; padding: 0 16px; font-weight: 600; }
  .bar { display: flex; align-items: center; gap: 10px; padding: 6px 12px 10px; }
  .av { width: 34px; height: 34px; border-radius: 50%; background: #111; color: #fff; display: grid; place-items: center; font-weight: 600; font-size: 13px; }
  .bar .t { font: 600 19px Barlow; flex: 1; }
  .bell { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; position: relative; }
  .bell svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; }
  .dot { position: absolute; top: 2px; right: 2px; width: 14px; height: 14px; border-radius: 50%; background: #C42B21; color: #fff; font-size: 9px; display: grid; place-items: center; }
  .body { flex: 1; overflow: hidden; padding: 4px 12px; display: flex; flex-direction: column; gap: 10px; }
  .hero { border-radius: 14px; padding: 12px 14px; }
  .hero .k { font-weight: 600; font-size: 13px; }
  .hero .n { font: 600 40px/1 "Barlow Condensed"; margin: 6px 0 4px; }
  .hero .s { font-size: 12px; }
  .strip { background: var(--card); border: 1px solid var(--line); border-radius: 14px; display: grid; grid-template-columns: repeat(3, 1fr); padding: 10px 12px; gap: 6px; }
  .strip .l { color: var(--muted); font-size: 11px; }
  .strip .v { font: 600 22px "Barlow Condensed"; }
  .strip .d { color: var(--muted); font-size: 10.5px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px; }
  .card h3 { margin: 0 0 8px; font: 600 15px Barlow; }
  .field { border: 1px solid var(--edge); border-radius: 999px; padding: 6px 12px; font-size: 12px; margin-bottom: 8px; display: inline-block; }
  .btn { display: inline-block; border-radius: 999px; padding: 8px 16px; font-weight: 600; font-size: 13px; }
  .chips { display: flex; gap: 6px; margin-top: 2px; }
  .chip { border: 1px solid var(--edge); border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 500; }
  .chip.on { border-color: transparent; }
  .tabs { display: flex; justify-content: space-around; padding: 8px 4px 12px; }
  .tab { display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 10.5px; font-weight: 500; width: 56px; }
  .tab .pill { width: 46px; height: 24px; border-radius: 12px; display: grid; place-items: center; }
  .tab svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tab.on { font-weight: 600; }

  /* ---------- current light ---------- */
  .cur .status, .cur .bar { background: var(--page); }
  .cur .hero { background: #111; color: #fff; }
  .cur .btn { background: #111; color: #fff; }
  .cur .chip.on { background: var(--y); }
  .cur .tabs { background: #fff; border-top: 1px solid var(--line); }
  .cur .tab { color: var(--muted); }
  .cur .tab.on { color: #111; } .cur .tab.on .pill { background: #111; color: var(--y); }

  /* ---------- A: yellow bottom bar only ---------- */
  .a .status, .a .bar { background: var(--page); }
  .a .hero { background: #111; color: #fff; }
  .a .btn { background: #111; color: #fff; }
  .a .chip.on { background: var(--y); }
  .a .tabs { background: var(--y); }
  .a .tab { color: #3d3a00; }
  .a .tab.on { color: #111; } .a .tab.on .pill { background: #111; color: var(--y); }

  /* ---------- B: bar + yellow for the things that are yellow in dark mode ---------- */
  .b .status, .b .bar { background: var(--page); }
  .b .hero { background: var(--y); color: #111; }
  .b .btn { background: var(--y); color: #111; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .b .chip.on { background: #111; color: var(--y); }
  .b .tabs { background: var(--y); }
  .b .tab { color: #3d3a00; }
  .b .tab.on { color: #111; } .b .tab.on .pill { background: #111; color: var(--y); }

  /* ---------- C: B plus a yellow top bar (yellow frame top and bottom) ---------- */
  .c .status, .c .bar { background: var(--y); }
  .c .av { background: #111; }
  .c .bar + .body { padding-top: 10px; }
  .c .hero { background: #111; color: #fff; }
  .c .hero .n { color: var(--y); }
  .c .btn { background: var(--y); color: #111; box-shadow: inset 0 0 0 1px rgba(0,0,0,.12); }
  .c .chip.on { background: #111; color: var(--y); }
  .c .tabs { background: var(--y); }
  .c .tab { color: #3d3a00; }
  .c .tab.on { color: #111; } .c .tab.on .pill { background: #111; color: var(--y); }

  /* ---------- dark (stays as it is) ---------- */
  .dk { --page: #0E0E0E; --card: #1A1A1A; --line: #2A2A2A; --muted: #A6A6A6; --edge: #757575; color: #F2F2F2; }
  .dk .status, .dk .bar { background: #0E0E0E; }
  .dk .av { background: #F2F2F2; color: #111; }
  .dk .bell { background: #242424; }
  .dk .hero { background: var(--y); color: #111; }
  .dk .btn { background: var(--y); color: #111; }
  .dk .chip.on { background: var(--y); color: #111; }
  .dk .tabs { background: #161616; }
  .dk .tab { color: #A6A6A6; }
  .dk .tab.on { color: #F2F2F2; } .dk .tab.on .pill { background: var(--y); color: #111; }
</style>
</head>
<body>
<header class="top">
  <h1>Phone, light mode: where the yellow goes</h1>
  <p>The coach Dashboard as an example; every phone page follows the same rules. Windows stays as it is. Dark mode on the right does not change.</p>
</header>
<div class="row" id="row"></div>
<template id="screen">
  <div class="phone">
    <div class="status">4:47</div>
    <div class="bar"><div class="av">LC</div><div class="t">Dashboard</div><div class="bell"><svg viewBox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg><span class="dot">1</span></div></div>
    <div class="body">
      <div class="hero"><div class="k">Next session</div><div class="n">9:00 AM</div><div class="s">Fri 13 Nov with Alex Tan</div></div>
      <div class="strip"><div><div class="l">This month</div><div class="v">9</div><div class="d">2 coming up</div></div><div><div class="l">Attendance</div><div class="v">60%</div><div class="d">of sessions</div></div><div><div class="l">Trainees</div><div class="v">2</div><div class="d">with you now</div></div></div>
      <div class="card">
        <h3>Post a shift</h3>
        <div class="chips"><span class="chip on">Today</span><span class="chip">Tomorrow</span><span class="chip">Pick a day</span></div>
        <div style="margin-top:8px"><span class="field">8:00 AM</span> <span class="field">4 hours</span></div>
        <span class="btn">Post shift</span>
      </div>
    </div>
    <div class="tabs">
      <div class="tab on"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>Dashboard</div>
      <div class="tab"><span class="pill"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></span>Sessions</div>
      <div class="tab"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="9" cy="7" r="4"/><path d="M3 21v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2M16 3.1a4 4 0 0 1 0 7.8M21 21v-2a4 4 0 0 0-3-3.9"/></svg></span>Shifts</div>
      <div class="tab"><span class="pill"><svg viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Messages</div>
      <div class="tab"><span class="pill"><svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg></span>More</div>
    </div>
  </div>
</template>
<script>
  const cols = [
    ['cur', 'Today (light)', 'White bar, black buttons and black Next session card. Yellow only on a chosen chip.'],
    ['a', 'A: yellow bar', 'Only the bottom bar turns yellow. The chosen tab stays a black pill with a yellow icon.'],
    ['b', 'B: yellow bar + yellow where dark mode is yellow', 'Bar, main buttons and the Next session card turn yellow, as they are in dark mode. Chosen chips go black with yellow text so they still stand out.'],
    ['c', 'C: yellow frame', 'Top bar and bottom bar both yellow, main buttons yellow. The Next session card stays black with a yellow time, so the page is not all yellow.'],
    ['dk', 'Dark (unchanged)', 'For comparison: the near-black bar with the yellow pill stays.'],
  ];
  const row = document.getElementById('row'), tpl = document.getElementById('screen');
  for (const [cls, title, what] of cols) {
    const col = document.createElement('div'); col.className = 'col';
    col.innerHTML = `<h2>${title}</h2><p class="what">${what}</p>`;
    const phone = tpl.content.firstElementChild.cloneNode(true); phone.classList.add(cls);
    col.appendChild(phone); row.appendChild(col);
  }
</script>
</body>
</html>
